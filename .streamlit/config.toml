[theme]
base = "light"
primaryColor = "#0e7490"
backgroundColor = "#f5f7fa"
secondaryBackgroundColor = "#e8edf3"
textColor = "#14213d"
baseFontSize = 17
font = "sans serif"

[theme.sidebar]
backgroundColor = "#0f1f3d"
secondaryBackgroundColor = "#1b2f57"
textColor = "#e8eefb"
primaryColor = "#5eead4"

[client]
toolbarMode = "minimal"
showErrorDetails = "none"

[browser]
gatherUsageStats = false

[server]
headless = true
